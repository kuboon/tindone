name: deploy

# Deploys main to Cloudflare Workers. Needs the repository secrets CLOUDFLARE_API_TOKEN (a token
# with "Edit Cloudflare Workers" and "D1 Edit" permissions) and CLOUDFLARE_ACCOUNT_ID. The Worker's
# own secrets are set once with `wrangler secret put` — see README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build
      # Before the deploy, so the new code never meets an old schema. Over D1's REST API, with the
      # same token the deploy uses; the database id is the one in wrangler.jsonc.
      - name: Migrate the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: da8be679-c6be-4acb-b6a7-36dbb86b2b61
        run: deno task db migrate --remote
      # Not cloudflare/wrangler-action: it runs `npm i wrangler` in web/, and npm cannot read the
      # node_modules Deno lays out there. npx fetches Wrangler into its own cache instead, the same
      # way ci.yml's dry run does.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

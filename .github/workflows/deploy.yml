name: deploy

# Deploys main to Cloudflare Workers. Needs the repository secrets CLOUDFLARE_API_TOKEN (a token
# with "Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID, plus TURSO_DATABASE_URL and
# TURSO_AUTH_TOKEN for the migration step. The Worker's own secrets are set once with
# `wrangler secret put` — see README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build
      - name: Migrate the database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::error::TURSO_DATABASE_URL is not set as a repository secret"
            exit 1
          fi
          deno task db migrate
      # Not cloudflare/wrangler-action: it runs `npm i wrangler` in web/, and npm cannot read the
      # node_modules Deno lays out there. npx fetches Wrangler into its own cache instead, the same
      # way ci.yml's dry run does.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      # One-time: give the Worker its secrets. Remove this step once it has run.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: deno task init-secrets
